name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly: catch resources that die after merge
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200,206,429
            --exclude esl\.cs\.brown\.edu
            --exclude coursera\.org
            --exclude iacr\.org
            README.md CONTRIBUTING.md
          fail: true

  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Roadmap SVG is in sync with its renderer
        run: |
          python scripts/render_map.py --check
