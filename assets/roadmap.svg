<line x1="200" y1="672" x2="200" y2="704" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="200" y1="756" x2="200" y2="788" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
