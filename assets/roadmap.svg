<text x="60" y="42" font-size="21" font-weight="700" fill="#1b2430">Working engineer → shipping cryptography safely</text>
<text x="60" y="66" font-size="13" fill="#5a6472">Every node is a milestone with a pass/fail flag. ⭐ = flagship break. 🔀 = fork. Spine = OWASP A04 checklist.</text>
<text x="60" y="94" font-size="12" fill="#7a5fb0" font-weight="600">🔀 Pick your order: A = Cryptopals-first · B = CryptoHack-first — both merge into §1.</text>
