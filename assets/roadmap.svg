<path d="M 340 646 C 380 646, 380 898, 340 898" fill="none" stroke="#5a6472" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="364" y="566" font-size="12" fill="#5a6472">deployment-facing · runs alongside</text>
<text x="364" y="894" font-size="12" fill="#d08a2e" font-weight="600">read anytime after §6</text>
<text x="364" y="910" font-size="12" fill="#5a6472">precision: read NIST, not the blogs</text>
<text x="364" y="986" font-size="12" fill="#5b7aa8" font-weight="600">🔀 design fork → Ph.D. (Kamara)</text>
